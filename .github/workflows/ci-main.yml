name: DEPLOY MAIN JEVON API

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Golang Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Lintin Code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

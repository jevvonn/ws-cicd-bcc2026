name: DEPLOY MAIN JEVON API

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Golang Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Linting Code
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  test:
    name: Golang Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Golang
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.3

      - name: Testing Code
        run: go test ./... -v -cover

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Github Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.AUTH_GITHUB_TOKEN }}

      - name: Build Image & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ github.repository_owner }}/${{ vars.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.AUTH_GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN
          script: |
            cd $HOME/${{ github.event.repository.name }}

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export IMAGE_NAME
            export IMAGE_TAG

            docker compose pull
            docker compose up -d --remove-orphans
